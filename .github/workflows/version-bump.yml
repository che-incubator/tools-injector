name: Version Bump

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
    inputs:
      tool:
        description: 'Specific tool to check'
        required: false
        type: choice
        options:
          - ''
          - opencode
          - goose
          - claude-code
          - kilocode
          - gemini-cli
          - cursor-cli
          - tmux
          - python3
          - gh
          - codex

permissions:
  contents: write
  pull-requests: write

jobs:

  check-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - name: opencode
            source: github
            repo: anomalyco/opencode
            arg_name: OPENCODE_VERSION
          - name: goose
            source: github
            repo: block/goose
            arg_name: GOOSE_VERSION
          # releases are tagged rust-v<semver>; the version files hold plain semver
          - name: codex
            source: github
            repo: openai/codex
            arg_name: CODEX_VERSION
            tag_prefix: rust-v
          - name: claude-code
            source: github
            repo: anthropics/claude-code
            arg_name: CLAUDE_CODE_VERSION
            strip_v: true
          # repo must be the one the Dockerfile downloads binaries from (tmux-builds), not upstream tmux/tmux
          - name: tmux
            source: github
            repo: tmux/tmux-builds
            arg_name: TMUX_VERSION
            strip_v: true
          - name: gh
            source: github
            repo: cli/cli
            arg_name: GH_VERSION
            strip_v: true
          - name: kilocode
            source: npm
            package: "@kilocode/cli"
            arg_name: KILOCODE_VERSION
          - name: gemini-cli
            source: npm
            package: "@google/gemini-cli"
            arg_name: GEMINI_CLI_VERSION
          - name: cursor-cli
            source: custom-install-script
            script_url: "https://cursor.com/install"
            version_grep: '(?<=downloads\.cursor\.com/lab/)\d{4}\.\d{2}\.\d{2}-[0-9a-f]+(?=/)'
            arg_name: CURSOR_CLI_VERSION
          # PBS releases are tagged by date; the Dockerfile pins both the Python version and the PBS release
          - name: python3
            source: python-build-standalone
            repo: astral-sh/python-build-standalone
            arg_name: PYTHON3_VERSION
            release_arg_name: PYTHON3_PBS_RELEASE

    steps:
      - name: "Checkout source code"
        if: inputs.tool == '' || inputs.tool == matrix.tool.name
        uses: actions/checkout@v6

      - name: "Read current version"
        if: inputs.tool == '' || inputs.tool == matrix.tool.name
        id: current
        run: |
          CURRENT=$(cat "dockerfiles/${{ matrix.tool.name }}/VERSION" | tr -d '[:space:]')
          # Later steps splice this value into scripts through GitHub expressions, so refuse anything
          # that is not plain version text (this also rejects an empty or missing file).
          if [[ ! "$CURRENT" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "::error::Missing or unexpected characters in dockerfiles/${{ matrix.tool.name }}/VERSION"
            exit 1
          fi
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Current ${{ matrix.tool.name }} version: ${CURRENT}"

      - name: "Fetch latest version (GitHub)"
        if: >-
          (inputs.tool == '' || inputs.tool == matrix.tool.name) &&
          matrix.tool.source == 'github'
        id: latest_github
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ matrix.tool.tag_prefix }}
        run: |
          TAG=$(gh api "repos/${{ matrix.tool.repo }}/releases/latest" --jq '.tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Failed to fetch latest release tag for ${{ matrix.tool.repo }}"
            exit 1
          fi
          echo "Raw tag: ${TAG}"

          if [ -n "$TAG_PREFIX" ]; then
            case "$TAG" in
              "$TAG_PREFIX"*) LATEST="${TAG#"$TAG_PREFIX"}" ;;
              *) echo "::error::Latest release tag '${TAG}' of ${{ matrix.tool.repo }} does not start with '${TAG_PREFIX}'"; exit 1 ;;
            esac
          elif [ "${{ matrix.tool.strip_v }}" = "true" ]; then
            LATEST="${TAG#v}"
          else
            LATEST="${TAG}"
          fi

          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest ${{ matrix.tool.name }} version: ${LATEST}"

      - name: "Fetch latest version (npm)"
        if: >-
          (inputs.tool == '' || inputs.tool == matrix.tool.name) &&
          matrix.tool.source == 'npm'
        id: latest_npm
        run: |
          LATEST=$(npm view "${{ matrix.tool.package }}" dist-tags.latest)
          if [ -z "$LATEST" ]; then
            echo "::error::Failed to fetch latest npm version for ${{ matrix.tool.package }}"
            exit 1
          fi
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest ${{ matrix.tool.name }} version: ${LATEST}"

      - name: "Fetch latest version (custom-install-script)"
        if: >-
          (inputs.tool == '' || inputs.tool == matrix.tool.name) &&
          matrix.tool.source == 'custom-install-script'
        id: latest_custom
        run: |
          SCRIPT=$(curl -fsSL "${{ matrix.tool.script_url }}")
          if [ -z "$SCRIPT" ]; then
            echo "::error::Failed to fetch install script from ${{ matrix.tool.script_url }}"
            exit 1
          fi
          LATEST=$(echo "$SCRIPT" | grep -oP '${{ matrix.tool.version_grep }}' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "::error::Failed to extract version from ${{ matrix.tool.script_url }}"
            exit 1
          fi
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest ${{ matrix.tool.name }} version: ${LATEST}"

      - name: "Fetch latest version (python-build-standalone)"
        if: >-
          (inputs.tool == '' || inputs.tool == matrix.tool.name) &&
          matrix.tool.source == 'python-build-standalone'
        id: latest_pbs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ matrix.tool.repo }}
          CURRENT: ${{ steps.current.outputs.version }}
          TOOL: ${{ matrix.tool.name }}
        run: |
          TAG=$(gh api "repos/${REPO}/releases/latest" --jq .tag_name)
          if [[ ! "$TAG" =~ ^[0-9]{8}$ ]]; then
            echo "::error::Latest release tag of ${REPO} is not an 8-digit date: '${TAG}'"
            exit 1
          fi

          ASSETS=$(gh api "repos/${REPO}/releases/latest" --jq '.assets[].name')
          # highest Python 3.13 patch shipped by this PBS release
          PY=$(echo "$ASSETS" | grep -oP '^cpython-\K3\.13\.[0-9]+(?=\+)' | sort -V | tail -1)
          if [ -z "$PY" ]; then
            echo "::error::No 3.13 asset in latest ${REPO} release"
            exit 1
          fi

          # the image is built for linux/amd64 and linux/arm64, so both arches must be present
          for ARCH in x86_64 aarch64; do
            ASSET="cpython-${PY}+${TAG}-${ARCH}-unknown-linux-gnu-install_only_stripped.tar.gz"
            if ! echo "$ASSETS" | grep -qxF "$ASSET"; then
              echo "::error::Missing asset ${ASSET} in latest ${REPO} release"
              exit 1
            fi
          done

          # never move backwards: if the newest 3.13 patch is below the pinned one, keep the current version
          if [ "$PY" != "$CURRENT" ] && [ "$PY" = "$(printf '%s\n%s\n' "$PY" "$CURRENT" | sort -V | head -1)" ]; then
            echo "::warning::Latest ${REPO} 3.13 patch ${PY} is lower than current ${CURRENT}; keeping ${CURRENT}"
            PY="$CURRENT"
          fi

          echo "version=${PY}" >> "$GITHUB_OUTPUT"
          echo "release=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Latest ${TOOL} version: ${PY} (PBS release ${TAG})"

      - name: "Resolve latest version"
        if: inputs.tool == '' || inputs.tool == matrix.tool.name
        id: latest
        env:
          FROM_GITHUB: ${{ steps.latest_github.outputs.version }}
          FROM_NPM: ${{ steps.latest_npm.outputs.version }}
          FROM_CUSTOM: ${{ steps.latest_custom.outputs.version }}
          FROM_PBS: ${{ steps.latest_pbs.outputs.version }}
          FROM_PBS_RELEASE: ${{ steps.latest_pbs.outputs.release }}
        run: |
          VERSION="${FROM_GITHUB:-${FROM_NPM:-${FROM_CUSTOM:-${FROM_PBS}}}}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version found for ${{ matrix.tool.name }}"
            exit 1
          fi
          # The version comes from an external source and later steps splice it into
          # scripts through GitHub expressions, so refuse anything that is not plain version text.
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "::error::Unexpected characters in the version fetched for ${{ matrix.tool.name }}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ -n "$FROM_PBS_RELEASE" ]; then
            if [[ ! "$FROM_PBS_RELEASE" =~ ^[0-9]{8}$ ]]; then
              echo "::error::Unexpected python-build-standalone release tag for ${{ matrix.tool.name }}: '${FROM_PBS_RELEASE}'"
              exit 1
            fi
            echo "release=${FROM_PBS_RELEASE}" >> "$GITHUB_OUTPUT"
          fi

      - name: "Compare versions"
        if: inputs.tool == '' || inputs.tool == matrix.tool.name
        id: compare
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"
          # Compares the Python version only: a PBS rebuild with the same 3.13 patch (e.g. refreshed
          # bundled OpenSSL/SQLite) is deliberately not picked up. Upgrade path: also compare the
          # PYTHON3_PBS_RELEASE pin when this needs to cover rebuilds.
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.tool.name }} is up to date (${CURRENT})"
          else
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.tool.name }} needs bump: ${CURRENT} → ${LATEST}"
          fi

      - name: "Check for existing PR"
        if: >-
          (inputs.tool == '' || inputs.tool == matrix.tool.name) &&
          steps.compare.outputs.needs_bump == 'true'
        id: existing_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="bump/${{ matrix.tool.name }}-${{ steps.latest.outputs.version }}"
          EXISTING=$(gh pr list --head "${BRANCH}" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "PR already exists for ${BRANCH}, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Close outdated bump PRs"
        if: >-
          (inputs.tool == '' || inputs.tool == matrix.tool.name) &&
          steps.compare.outputs.needs_bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ matrix.tool.name }}
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          CURRENT_BRANCH="bump/${TOOL}-${LATEST}"
          gh pr list --state open --label "version-bump" --json number,headRefName --jq \
            ".[] | select(.headRefName | startswith(\"bump/${TOOL}-\")) | select(.headRefName != \"${CURRENT_BRANCH}\") | .number" | \
          while read -r PR_NUM; do
            echo "Closing outdated PR #${PR_NUM} (superseded by ${TOOL} ${LATEST})"
            gh pr close "${PR_NUM}" --comment "Superseded by bump to ${LATEST}." --delete-branch
          done

      - name: "Create bump branch and push"
        if: >-
          (inputs.tool == '' || inputs.tool == matrix.tool.name) &&
          steps.compare.outputs.needs_bump == 'true' &&
          steps.existing_pr.outputs.exists == 'false'
        env:
          CURRENT: ${{ steps.current.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
          TOOL: ${{ matrix.tool.name }}
          ARG_NAME: ${{ matrix.tool.arg_name }}
          RELEASE_ARG_NAME: ${{ matrix.tool.release_arg_name }}
          LATEST_RELEASE: ${{ steps.latest.outputs.release }}
        run: |
          BRANCH="bump/${TOOL}-${LATEST}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"

          echo -n "${LATEST}" > "dockerfiles/${TOOL}/VERSION"
          sed -i "s/^ARG ${ARG_NAME}=.*/ARG ${ARG_NAME}=${LATEST}/" "dockerfiles/${TOOL}/Dockerfile"
          if [ -n "$RELEASE_ARG_NAME" ]; then
            sed -i "s/^ARG ${RELEASE_ARG_NAME}=.*/ARG ${RELEASE_ARG_NAME}=${LATEST_RELEASE}/" "dockerfiles/${TOOL}/Dockerfile"
          fi

          git add "dockerfiles/${TOOL}/VERSION" "dockerfiles/${TOOL}/Dockerfile"
          git commit -s -m "bump(${TOOL}): ${CURRENT} → ${LATEST}"
          git push --force-with-lease origin "${BRANCH}"

      - name: "Set up QEMU"
        if: >-
          (inputs.tool == '' || inputs.tool == matrix.tool.name) &&
          steps.compare.outputs.needs_bump == 'true' &&
          steps.existing_pr.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v4

      - name: "Set up Docker Buildx"
        if: >-
          (inputs.tool == '' || inputs.tool == matrix.tool.name) &&
          steps.compare.outputs.needs_bump == 'true' &&
          steps.existing_pr.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: "Docker quay.io Login"
        if: >-
          (inputs.tool == '' || inputs.tool == matrix.tool.name) &&
          steps.compare.outputs.needs_bump == 'true' &&
          steps.existing_pr.outputs.exists == 'false'
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: "Build and push image"
        if: >-
          (inputs.tool == '' || inputs.tool == matrix.tool.name) &&
          steps.compare.outputs.needs_bump == 'true' &&
          steps.existing_pr.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/${{ matrix.tool.name }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: quay.io/che-incubator/tools-injector/${{ matrix.tool.name }}:bump-${{ steps.latest.outputs.version }}

      - name: "Open pull request"
        if: >-
          (inputs.tool == '' || inputs.tool == matrix.tool.name) &&
          steps.compare.outputs.needs_bump == 'true' &&
          steps.existing_pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.current.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
          LATEST_RELEASE: ${{ steps.latest.outputs.release }}
          TOOL: ${{ matrix.tool.name }}
          SOURCE: ${{ matrix.tool.source }}
          STRIP_V: ${{ matrix.tool.strip_v }}
          TAG_PREFIX: ${{ matrix.tool.tag_prefix }}
          REPO: ${{ matrix.tool.repo }}
          PACKAGE: ${{ matrix.tool.package }}
        run: |
          BRANCH="bump/${TOOL}-${LATEST}"
          IMAGE="quay.io/che-incubator/tools-injector/${TOOL}:bump-${LATEST}"

          RELEASE_URL=""
          if [ "$SOURCE" = "github" ]; then
            TAG="${LATEST}"
            if [ "$STRIP_V" = "true" ]; then
              TAG="v${LATEST}"
            elif [ -n "$TAG_PREFIX" ]; then
              TAG="${TAG_PREFIX}${LATEST}"
            fi
            RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          elif [ "$SOURCE" = "npm" ]; then
            RELEASE_URL="https://www.npmjs.com/package/${PACKAGE}/v/${LATEST}"
          elif [ "$SOURCE" = "python-build-standalone" ]; then
            RELEASE_URL="https://github.com/${REPO}/releases/tag/${LATEST_RELEASE}"
          fi

          BODY="## Version Bump"
          BODY="${BODY}"$'\n'"**Tool:** ${TOOL}"
          BODY="${BODY}"$'\n'"**Current:** ${CURRENT}"
          BODY="${BODY}"$'\n'"**New:** ${LATEST}"
          BODY="${BODY}"$'\n'"**Image:** \`${IMAGE}\`"

          if [ -n "$RELEASE_URL" ]; then
            BODY="${BODY}"$'\n'"**Release:** ${RELEASE_URL}"
          fi

          BODY="${BODY}"$'\n\n'"---"$'\n'"*Automated by the version-bump workflow.*"

          gh label create "automated" --description "Automated PR" --color "0e8a16" 2>/dev/null || true
          gh label create "version-bump" --description "Tool version update" --color "1d76db" 2>/dev/null || true

          if ! gh pr create \
            --head "${BRANCH}" \
            --base main \
            --title "bump(${TOOL}): ${CURRENT} → ${LATEST}" \
            --body "${BODY}" \
            --label "automated" \
            --label "version-bump"; then
            echo "PR creation failed, cleaning up branch"
            git push origin --delete "${BRANCH}" || true
            exit 1
          fi
