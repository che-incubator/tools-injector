name: PR Build

on:
  pull_request:
    branches: ['*']

jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_tools: ${{ steps.set-matrix.outputs.has_tools }}
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Get changed files"
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/${BASE_REF}...HEAD" > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: "Build tool matrix from changed files"
        id: set-matrix
        run: |
          TOOLS=$(python3 -c "import json; print(' '.join(sorted(json.load(open('inject-tool/registry.json'))['tools'])))")
          REBUILD_ALL=false

          if grep -q '^\.github/workflows/pr\.yml' changed_files.txt; then
            REBUILD_ALL=true
          fi

          MATRIX="["
          FIRST=true
          for TOOL in $TOOLS; do
            if [ "$REBUILD_ALL" = "true" ] || grep -q "^dockerfiles/${TOOL}/" changed_files.txt; then
              if [ "$FIRST" = "true" ]; then
                FIRST=false
              else
                MATRIX="${MATRIX},"
              fi
              if [ "$TOOL" = "gemini-cli" ]; then
                PLATFORMS="linux/amd64,linux/arm64,linux/s390x,linux/ppc64le"
              else
                PLATFORMS="linux/amd64,linux/arm64"
              fi
              MATRIX="${MATRIX}{\"name\":\"${TOOL}\",\"dockerfile\":\"dockerfiles/${TOOL}\",\"platforms\":\"${PLATFORMS}\"}"
            fi
          done
          MATRIX="${MATRIX}]"

          if [ "$MATRIX" = "[]" ]; then
            echo "has_tools=false" >> "$GITHUB_OUTPUT"
            echo "No tool changes detected, skipping builds"
          else
            echo "has_tools=true" >> "$GITHUB_OUTPUT"
            echo "Tools to build: ${MATRIX}"
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  check-registry-versions:
    runs-on: ubuntu-latest
    steps:
      -
        name: "Checkout source code"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      -
        name: "Check version pins are in sync (VERSION file, Dockerfile ARG, registry.json)"
        run: |
          python3 - <<'EOF'
          import json, pathlib, re, sys

          registry = json.loads(pathlib.Path("inject-tool/registry.json").read_text())
          failures = []
          for tool, entry in sorted(registry["tools"].items()):
              expected = pathlib.Path(f"dockerfiles/{tool}/VERSION").read_text().strip()
              arg_name = tool.upper().replace("-", "_") + "_VERSION"
              match = re.search(rf"^ARG {arg_name}=(\S+)$",
                                pathlib.Path(f"dockerfiles/{tool}/Dockerfile").read_text(), re.M)
              sources = {
                  "Dockerfile ARG": match.group(1) if match else None,
                  "registry.json": entry.get("version"),
              }
              for where, value in sources.items():
                  if value != expected:
                      failures.append(f"{tool}: {where} is {value!r}, VERSION file says {expected!r}")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)
          print(f"All {len(registry['tools'])} tools have matching version pins")
          EOF

  build-tools:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_tools == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    env:
      IMAGE: quay.io/che-incubator/tools-injector/${{ matrix.tool.name }}
      TAG: pr-${{ github.event.pull_request.number }}
    steps:
      -
        name: "Checkout source code"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      -
        name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3
      -
        name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
      -
        name: "Docker quay.io Login"
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      -
        name: "Build and push ${{ matrix.tool.name }}"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.tool.dockerfile }}/Dockerfile
          platforms: ${{ matrix.tool.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
      -
        name: "Set tag expiration (14 days)"
        continue-on-error: true
        run: |
          EXPIRATION=$(date -u -d '+14 days' +%s)
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.QUAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"expiration\": ${EXPIRATION}}" \
            "https://quay.io/api/v1/repository/che-incubator/tools-injector%2F${{ matrix.tool.name }}/tag/${{ env.TAG }}"

  check-tool-registration:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: "Check every registry tool is registered in every list"
        run: |
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          registry = json.loads(Path("inject-tool/registry.json").read_text())
          tools = set(registry["tools"])

          checks = {}

          makefile = Path("Makefile").read_text()
          m = re.search(r"^TOOLS\s*:=\s*(.+)$", makefile, re.M)
          checks["Makefile TOOLS list"] = set(m.group(1).split()) if m else set()

          # the pr.yml and release.yml build matrices are derived from
          # registry.json at run time, so they need no static-list check here

          bump_yml = Path(".github/workflows/version-bump.yml").read_text()
          checks["version-bump.yml matrix"] = set(
              re.findall(r"^\s+- name: (\S+)$", bump_yml, re.M))
          m = re.search(r"type: choice\s*\n\s*options:\s*\n((?:\s+- \S+\s*\n)+)", bump_yml)
          choices = set(re.findall(r"-\s+'?([^'\s]+)", m.group(1))) if m else set()
          checks["version-bump.yml dispatch choices"] = choices

          readme = Path("inject-tool/README.md").read_text()
          checks["README.md tools table"] = set(
              re.findall(r"^\| (\S+) \| (?:init|bundle) \|", readme, re.M))

          checks["dockerfiles/ directories"] = {
              p.name for p in Path("dockerfiles").iterdir() if p.is_dir()}

          failed = False
          for label, found in checks.items():
              for t in sorted(tools - found):
                  print(f"::error file=inject-tool/registry.json::"
                          f"tool '{t}' is in registry.json but missing from {label}")
                  failed = True
              for t in sorted(found - tools):
                  print(f"::error::{label} lists '{t}' which is not in registry.json")
                  failed = True

          if failed:
              sys.exit(1)
          print(f"OK: all {len(tools)} registry tools registered in every list")
          PY
