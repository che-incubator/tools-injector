name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  detect-tools:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v6
      - name: "Build tool matrix from registry.json"
        id: set-matrix
        run: |
          TOOLS=$(python3 -c "import json; print(' '.join(sorted(json.load(open('inject-tool/registry.json'))['tools'])))")
          echo "Tools to release: ${TOOLS}"

          MATRIX="["
          FIRST=true
          for TOOL in $TOOLS; do
            if [ "$FIRST" = "true" ]; then
              FIRST=false
            else
              MATRIX="${MATRIX},"
            fi
            if [ "$TOOL" = "gemini-cli" ]; then
              PLATFORMS="linux/amd64,linux/arm64,linux/s390x,linux/ppc64le"
            else
              PLATFORMS="linux/amd64,linux/arm64"
            fi
            MATRIX="${MATRIX}{\"name\":\"${TOOL}\",\"dockerfile\":\"dockerfiles/${TOOL}\",\"platforms\":\"${PLATFORMS}\"}"
          done
          MATRIX="${MATRIX}]"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build-tools:
    needs: detect-tools
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: ${{ fromJson(needs.detect-tools.outputs.matrix) }}
    env:
      IMAGE: quay.io/che-incubator/tools-injector/${{ matrix.tool.name }}
      TAG: next

    steps:
      -
        name: "Checkout source code"
        uses: actions/checkout@v6
      -
        name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3
      -
        name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
      -
        name: "Docker quay.io Login"
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      -
        name: "Build and push ${{ matrix.tool.name }}"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.tool.dockerfile }}/Dockerfile
          platforms: ${{ matrix.tool.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
