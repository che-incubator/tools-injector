paths:
  # The workflow_dispatch "tool" choice input starts with an empty-string option
  # ('' means "all tools"). GitHub accepts it, but actionlint reports it as a
  # syntax-check error, which also stops it from analysing the rest of the file.
  # Ignore only that message, and only for this workflow.
  .github/workflows/version-bump.yml:
    ignore:
      - 'string should not be empty'
